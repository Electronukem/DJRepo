name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gig finder and server tests
        run: |
          pip install pytest
          python -m pytest -v
      - name: Every script parses
        run: for f in web/*.js; do node --check "$f"; done
      - name: Song listener benchmark (tempo, bar lines, key)
        run: node benchmarks/listener.mjs
